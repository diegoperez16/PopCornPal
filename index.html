<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The same bucket the phone shows. Desktop browsers cache a favicon by
         URL and hold it for a very long time, so the version tag is what gets
         a tab that is still drawing the old mark to fetch this one; the PNGs
         are here for browsers that would rather not take the SVG. -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png?v=2" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png?v=2" />
    <!-- interactive-widget=resizes-content shrinks the viewport when the on-screen
         keyboard opens, so bottom sheets sized in dvh stay fully reachable.
         Scale is locked so the layout holds its proportions like an app's. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content, user-scalable=no, maximum-scale=1" />
    <meta name="theme-color" content="#14181c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&display=swap" />
    <meta name="description" content="Track and share your movies, shows, games, and books with friends" />
    
    <!-- iOS specific meta tags for home screen installation -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Popcorn Pal" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    
    <title>Popcorn Pal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
